# Lint + tests on every push and pull request. Tests use synthetic data, so no Kaggle download.
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install the locked versions (without torch; its tests skip themselves)
        run: |
          grep -v '^torch==' requirements.lock.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
          pip install -e . --no-deps
      - run: ruff check src tests app
      - run: pytest -q
